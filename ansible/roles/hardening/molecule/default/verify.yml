---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the deployed sshd configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Check the key sshd hardening directives
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config.content | b64decode)"
          - "'PasswordAuthentication no' in (sshd_config.content | b64decode)"
          - "'X11Forwarding no' in (sshd_config.content | b64decode)"
          - "'MaxAuthTries 3' in (sshd_config.content | b64decode)"

    - name: The deployed sshd configuration parses
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Read the sysctl drop-in
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-hardening.conf
      register: sysctl_conf

    - name: Check the sysctl drop-in
      ansible.builtin.assert:
        that:
          - "'net.ipv4.tcp_syncookies = 1' in (sysctl_conf.content | b64decode)"

    - name: Stat the fail2ban jail
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: jail

    - name: Check the fail2ban jail exists
      ansible.builtin.assert:
        that: jail.stat.exists
